<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WashedByWon — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sacramento&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#080808;
  --white:#f5f5f5;
  --purple:#5c1f9e;
  --purple-bright:#7b2fd4;
  --purple-light:#a066e0;
  --purple-faint:#1a0a2e;
  --gray:#111111;
  --mid:#1a1a1a;
  --muted:#555;
  --muted2:#888;
  --border:#1f1f1f;
  --border2:#2a2a2a;
  --green:#1a7a4a;
  --green-light:#22c55e;
  --red:#7a1a1a;
  --red-light:#ef4444;
  --yellow:#7a6200;
  --yellow-light:#facc15;
  --blue:#1a3a7a;
  --blue-light:#60a5fa;
}
body{font-family:'DM Sans',sans-serif;background:var(--black);color:var(--white);min-height:100vh;overflow-x:hidden}

/* ── LOGIN ── */
#login-screen{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:1.5rem;
  background:radial-gradient(ellipse at top,rgba(92,31,158,0.18) 0%,transparent 60%);
}
.login-card{
  width:100%;max-width:380px;
  background:var(--mid);border:1px solid var(--border2);
  border-radius:8px;padding:2.5rem 2rem;
  display:flex;flex-direction:column;align-items:center;gap:1.5rem;
}
.login-logo{font-family:'Sacramento',cursive;font-size:2.4rem;color:var(--white);text-shadow:2px 2px 0 var(--purple)}
.login-subtitle{font-size:0.72rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted2)}
.login-form{width:100%;display:flex;flex-direction:column;gap:1rem}
.login-form input{
  width:100%;background:var(--black);border:1px solid var(--border2);
  color:var(--white);padding:0.75rem 1rem;border-radius:4px;
  font-family:'DM Sans',sans-serif;font-size:0.9rem;outline:none;
  transition:border-color 0.2s;
}
.login-form input:focus{border-color:var(--purple)}
.login-form input::placeholder{color:var(--muted)}
.login-btn{
  width:100%;background:var(--purple);color:var(--white);
  border:none;padding:0.85rem;border-radius:4px;
  font-family:'DM Sans',sans-serif;font-size:0.85rem;font-weight:600;
  letter-spacing:0.08em;cursor:pointer;transition:background 0.2s;
}
.login-btn:hover{background:var(--purple-bright)}
.login-error{color:var(--red-light);font-size:0.8rem;text-align:center;display:none}

/* ── DASHBOARD ── */
#dashboard{display:none;min-height:100vh;flex-direction:column}

/* Nav */
.dash-nav{
  display:flex;justify-content:space-between;align-items:center;
  padding:1rem 1.5rem;border-bottom:1px solid var(--border);
  background:rgba(8,8,8,0.95);backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:100;
}
.dash-logo{font-family:'Sacramento',cursive;font-size:1.8rem;color:var(--white);text-shadow:2px 2px 0 var(--purple)}
.dash-nav-right{display:flex;align-items:center;gap:1rem}
.dash-tag{font-size:0.65rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--purple-light);border:1px solid var(--purple);padding:0.25rem 0.7rem;border-radius:2px}
.logout-btn{
  background:transparent;border:1px solid var(--border2);color:var(--muted2);
  padding:0.4rem 0.9rem;border-radius:4px;font-family:'DM Sans',sans-serif;
  font-size:0.75rem;cursor:pointer;transition:all 0.2s;letter-spacing:0.05em;
}
.logout-btn:hover{border-color:var(--red-light);color:var(--red-light)}

/* Layout */
.dash-body{flex:1;padding:1.5rem;max-width:1200px;margin:0 auto;width:100%}

/* Stats row */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.75rem}
.stat-card{
  background:var(--mid);border:1px solid var(--border2);border-radius:8px;
  padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:0.4rem;
}
.stat-label{font-size:0.65rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted2)}
.stat-value{font-size:1.9rem;font-weight:600;color:var(--white)}
.stat-sub{font-size:0.75rem;color:var(--muted2)}
.stat-card.purple{border-color:var(--purple);background:var(--purple-faint)}
.stat-card.purple .stat-value{color:var(--purple-light)}

/* Tabs */
.tabs{display:flex;gap:0.25rem;margin-bottom:1.25rem;border-bottom:1px solid var(--border)}
.tab{
  background:transparent;border:none;color:var(--muted2);
  padding:0.6rem 1.1rem;font-family:'DM Sans',sans-serif;font-size:0.8rem;
  letter-spacing:0.05em;cursor:pointer;border-bottom:2px solid transparent;
  margin-bottom:-1px;transition:all 0.2s;
}
.tab:hover{color:var(--white)}
.tab.active{color:var(--purple-light);border-bottom-color:var(--purple-light)}

/* Bookings table */
.bookings-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:0.75rem}
.bookings-header h2{font-size:0.95rem;font-weight:600;letter-spacing:0.04em}
.filter-row{display:flex;gap:0.5rem;flex-wrap:wrap}
.filter-btn{
  background:var(--mid);border:1px solid var(--border2);color:var(--muted2);
  padding:0.35rem 0.85rem;border-radius:4px;font-family:'DM Sans',sans-serif;
  font-size:0.72rem;letter-spacing:0.05em;cursor:pointer;transition:all 0.2s;
}
.filter-btn:hover{border-color:var(--purple);color:var(--white)}
.filter-btn.active{background:var(--purple-faint);border-color:var(--purple);color:var(--purple-light)}

.bookings-list{display:flex;flex-direction:column;gap:0.75rem}

.booking-card{
  background:var(--mid);border:1px solid var(--border2);border-radius:8px;
  padding:1.25rem 1.5rem;display:grid;
  grid-template-columns:1fr auto;gap:1rem;align-items:start;
  transition:border-color 0.2s;
}
.booking-card:hover{border-color:var(--border2)}
.booking-card.confirmed{border-left:3px solid var(--green-light)}
.booking-card.pending{border-left:3px solid var(--yellow-light)}
.booking-card.cancelled{border-left:3px solid var(--red-light);opacity:0.6}
.booking-card.completed{border-left:3px solid var(--blue-light)}

.booking-main{}
.booking-top{display:flex;align-items:center;gap:0.75rem;margin-bottom:0.5rem;flex-wrap:wrap}
.booking-name{font-size:1rem;font-weight:600}
.booking-id{font-size:0.7rem;color:var(--muted2)}
.badge{
  display:inline-flex;align-items:center;padding:0.2rem 0.6rem;
  border-radius:3px;font-size:0.65rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;
}
.badge.pending{background:rgba(250,204,21,0.12);color:var(--yellow-light);border:1px solid rgba(250,204,21,0.25)}
.badge.confirmed{background:rgba(34,197,94,0.12);color:var(--green-light);border:1px solid rgba(34,197,94,0.25)}
.badge.cancelled{background:rgba(239,68,68,0.12);color:var(--red-light);border:1px solid rgba(239,68,68,0.25)}
.badge.completed{background:rgba(96,165,250,0.12);color:var(--blue-light);border:1px solid rgba(96,165,250,0.25)}

.booking-details{display:flex;flex-wrap:wrap;gap:0.4rem 1.5rem;font-size:0.78rem;color:var(--muted2)}
.booking-details span{display:flex;align-items:center;gap:0.3rem}
.booking-details strong{color:var(--white)}

.booking-actions{display:flex;flex-direction:column;gap:0.4rem;align-items:flex-end}
.action-btn{
  border:none;padding:0.4rem 0.9rem;border-radius:4px;
  font-family:'DM Sans',sans-serif;font-size:0.72rem;font-weight:600;
  letter-spacing:0.05em;cursor:pointer;transition:opacity 0.2s;white-space:nowrap;
}
.action-btn:hover{opacity:0.85}
.action-btn.confirm{background:var(--green-light);color:#000}
.action-btn.cancel{background:transparent;border:1px solid var(--red-light);color:var(--red-light)}
.action-btn.complete{background:var(--blue-light);color:#000}

/* Calendar view */
#calendar-view{display:none}
.cal-header{display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem}
.cal-header h2{font-size:0.95rem;font-weight:600}
.cal-nav{display:flex;align-items:center;gap:0.5rem}
.cal-nav button{
  background:var(--mid);border:1px solid var(--border2);color:var(--white);
  width:32px;height:32px;border-radius:4px;cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;transition:border-color 0.2s;
}
.cal-nav button:hover{border-color:var(--purple)}
.cal-month{font-size:0.85rem;font-weight:600;min-width:120px;text-align:center}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day-label{
  text-align:center;font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--muted2);padding:0.5rem 0;
}
.cal-cell{
  background:var(--mid);border:1px solid var(--border);border-radius:6px;
  min-height:80px;padding:0.5rem;cursor:pointer;transition:border-color 0.2s;
  position:relative;
}
.cal-cell:hover{border-color:var(--purple)}
.cal-cell.empty{background:transparent;border-color:transparent;cursor:default}
.cal-cell.today{border-color:var(--purple)}
.cal-cell.has-bookings{border-color:rgba(92,31,158,0.5);background:var(--purple-faint)}
.cal-date{font-size:0.75rem;font-weight:600;color:var(--muted2);margin-bottom:0.35rem}
.cal-cell.today .cal-date{color:var(--purple-light)}
.cal-dot{
  font-size:0.65rem;padding:0.15rem 0.35rem;border-radius:3px;
  margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cal-dot.pending{background:rgba(250,204,21,0.15);color:var(--yellow-light)}
.cal-dot.confirmed{background:rgba(34,197,94,0.15);color:var(--green-light)}
.cal-dot.completed{background:rgba(96,165,250,0.15);color:var(--blue-light)}

/* Empty state */
.empty-state{
  text-align:center;padding:3rem;color:var(--muted2);
  border:1px dashed var(--border2);border-radius:8px;
}
.empty-state p{font-size:0.85rem}

/* Toast */
.toast{
  position:fixed;bottom:1.5rem;right:1.5rem;
  background:var(--mid);border:1px solid var(--border2);border-radius:6px;
  padding:0.75rem 1.25rem;font-size:0.8rem;color:var(--white);
  z-index:999;opacity:0;transform:translateY(10px);
  transition:all 0.25s;pointer-events:none;
}
.toast.show{opacity:1;transform:none}
.toast.success{border-color:var(--green-light);color:var(--green-light)}
.toast.error{border-color:var(--red-light);color:var(--red-light)}

/* Loading */
.loading{text-align:center;padding:2rem;color:var(--muted2);font-size:0.85rem}

/* Responsive */
@media(max-width:700px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .booking-card{grid-template-columns:1fr}
  .booking-actions{flex-direction:row;align-items:flex-start}
}
@media(max-width:480px){
  .stats-row{grid-template-columns:1fr 1fr}
  .cal-cell{min-height:54px}
  .cal-dot{display:none}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">WashedByWon</div>
    <div class="login-subtitle">Admin Dashboard</div>
    <form class="login-form" id="login-form">
      <input type="password" id="password-input" placeholder="Enter admin password" autocomplete="current-password">
      <button type="submit" class="login-btn">Sign In</button>
      <div class="login-error" id="login-error">Incorrect password. Try again.</div>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <nav class="dash-nav">
    <div class="dash-logo">WashedByWon</div>
    <div class="dash-nav-right">
      <span class="dash-tag">Admin</span>
      <button class="logout-btn" onclick="logout()">Log Out</button>
    </div>
  </nav>

  <div class="dash-body">

    <!-- Stats -->
    <div class="stats-row" id="stats-row">
      <div class="stat-card purple">
        <div class="stat-label">Total Revenue</div>
        <div class="stat-value" id="stat-revenue">—</div>
        <div class="stat-sub">confirmed + completed</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending</div>
        <div class="stat-value" id="stat-pending">—</div>
        <div class="stat-sub">awaiting confirmation</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Confirmed</div>
        <div class="stat-value" id="stat-confirmed">—</div>
        <div class="stat-sub">upcoming</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Completed</div>
        <div class="stat-value" id="stat-completed">—</div>
        <div class="stat-sub">all time</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('list',this)">Bookings List</button>
      <button class="tab" onclick="switchTab('calendar',this)">Calendar</button>
    </div>

    <!-- List View -->
    <div id="list-view">
      <div class="bookings-header">
        <h2>All Bookings</h2>
        <div class="filter-row">
          <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
          <button class="filter-btn" onclick="setFilter('pending',this)">Pending</button>
          <button class="filter-btn" onclick="setFilter('confirmed',this)">Confirmed</button>
          <button class="filter-btn" onclick="setFilter('completed',this)">Completed</button>
          <button class="filter-btn" onclick="setFilter('cancelled',this)">Cancelled</button>
        </div>
      </div>
      <div class="bookings-list" id="bookings-list">
        <div class="loading">Loading bookings...</div>
      </div>
    </div>

    <!-- Calendar View -->
    <div id="calendar-view">
      <div class="cal-header">
        <h2>Calendar</h2>
        <div class="cal-nav">
          <button onclick="calPrev()">&#8249;</button>
          <div class="cal-month" id="cal-month-label"></div>
          <button onclick="calNext()">&#8250;</button>
        </div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://washedbywon-backend.onrender.com';
let adminKey = '';
let allBookings = [];
let currentFilter = 'all';
let calDate = new Date();

// ── Auth ──
document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('password-input').value.trim();
  // Verify by hitting the API
  const res = await fetch(`${API}/api/admin/bookings`, {
    headers: { 'x-admin-key': pw }
  });
  if (res.ok) {
    adminKey = pw;
    sessionStorage.setItem('wbw_key', pw);
    showDashboard();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
});

function logout() {
  sessionStorage.removeItem('wbw_key');
  adminKey = '';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('password-input').value = '';
}

// Auto-login if key saved in session
window.addEventListener('DOMContentLoaded', () => {
  const saved = sessionStorage.getItem('wbw_key');
  if (saved) { adminKey = saved; showDashboard(); }
});

async function showDashboard() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'flex';
  await loadBookings();
}

// ── Data ──
async function loadBookings() {
  try {
    const res = await fetch(`${API}/api/admin/bookings`, {
      headers: { 'x-admin-key': adminKey }
    });
    allBookings = await res.json();
    renderStats();
    renderList();
    renderCalendar();
  } catch (err) {
    showToast('Failed to load bookings', 'error');
  }
}

// ── Stats ──
function renderStats() {
  const pending   = allBookings.filter(b => b.status === 'pending').length;
  const confirmed = allBookings.filter(b => b.status === 'confirmed').length;
  const completed = allBookings.filter(b => b.status === 'completed').length;
  const revenue   = allBookings
    .filter(b => b.status === 'confirmed' || b.status === 'completed')
    .reduce((s, b) => s + (b.total || 0), 0);

  document.getElementById('stat-pending').textContent   = pending;
  document.getElementById('stat-confirmed').textContent = confirmed;
  document.getElementById('stat-completed').textContent = completed;
  document.getElementById('stat-revenue').textContent   = revenue ? `$${revenue}` : '$0';
}

// ── List ──
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function renderList() {
  const list = document.getElementById('bookings-list');
  let bookings = [...allBookings].sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
  if (currentFilter !== 'all') bookings = bookings.filter(b => b.status === currentFilter);

  if (!bookings.length) {
    list.innerHTML = '<div class="empty-state"><p>No bookings found.</p></div>';
    return;
  }

  list.innerHTML = bookings.map(b => {
    const dateStr = formatDate(b.date);
    const addons  = b.addons ? b.addons.join(', ') : null;
    const actions = actionsFor(b);
    return `
      <div class="booking-card ${b.status}" id="card-${b.id}">
        <div class="booking-main">
          <div class="booking-top">
            <span class="booking-name">${b.name}</span>
            <span class="booking-id">#${b.id}</span>
            <span class="badge ${b.status}">${b.status}</span>
          </div>
          <div class="booking-details">
            <span>📅 <strong>${dateStr} at ${b.time}</strong></span>
            <span>🚗 ${b.vehicle_size} — ${b.service}</span>
            <span>📍 ${b.address}</span>
            <span>📞 ${b.phone}</span>
            ${b.total ? `<span>💵 <strong>$${b.total}</strong></span>` : ''}
            ${addons ? `<span>➕ ${addons}</span>` : ''}
            ${b.notes ? `<span>📝 ${b.notes}</span>` : ''}
          </div>
        </div>
        <div class="booking-actions">${actions}</div>
      </div>`;
  }).join('');
}

function actionsFor(b) {
  const btns = [];
  if (b.status === 'pending') {
    btns.push(`<button class="action-btn confirm" onclick="updateStatus(${b.id},'confirmed')">Confirm</button>`);
    btns.push(`<button class="action-btn cancel"  onclick="updateStatus(${b.id},'cancelled')">Cancel</button>`);
  }
  if (b.status === 'confirmed') {
    btns.push(`<button class="action-btn complete" onclick="updateStatus(${b.id},'completed')">Complete</button>`);
    btns.push(`<button class="action-btn cancel"   onclick="updateStatus(${b.id},'cancelled')">Cancel</button>`);
  }
  return btns.join('');
}

async function updateStatus(id, status) {
  try {
    const res = await fetch(`${API}/api/admin/bookings/${id}`, {
      method: 'PATCH',
      headers: { 'x-admin-key': adminKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ status })
    });
    if (!res.ok) throw new Error();
    const b = allBookings.find(b => b.id === id);
    if (b) b.status = status;
    renderStats();
    renderList();
    renderCalendar();
    showToast(`Booking #${id} marked as ${status}`, 'success');
  } catch {
    showToast('Failed to update booking', 'error');
  }
}

// ── Calendar ──
function switchTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('list-view').style.display     = tab === 'list' ? '' : 'none';
  document.getElementById('calendar-view').style.display = tab === 'calendar' ? '' : 'none';
  if (tab === 'calendar') renderCalendar();
}

function calPrev() { calDate.setMonth(calDate.getMonth()-1); renderCalendar(); }
function calNext() { calDate.setMonth(calDate.getMonth()+1); renderCalendar(); }

function renderCalendar() {
  const year  = calDate.getFullYear();
  const month = calDate.getMonth();
  const days  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const today = new Date(); today.setHours(0,0,0,0);

  const label = calDate.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  document.getElementById('cal-month-label').textContent = label;

  const firstDay   = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();

  let html = days.map(d => `<div class="cal-day-label">${d}</div>`).join('');

  for (let i = 0; i < firstDay; i++) html += `<div class="cal-cell empty"></div>`;

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dt      = new Date(year, month, d);
    const isToday = dt.getTime() === today.getTime();
    const dayBookings = allBookings.filter(b => b.date === dateStr && b.status !== 'cancelled');
    const hasBookings = dayBookings.length > 0;

    const dots = dayBookings.slice(0,3).map(b =>
      `<div class="cal-dot ${b.status}">${b.name.split(' ')[0]}</div>`
    ).join('');

    html += `
      <div class="cal-cell${isToday?' today':''}${hasBookings?' has-bookings':''}">
        <div class="cal-date">${d}</div>
        ${dots}
      </div>`;
  }

  document.getElementById('cal-grid').innerHTML = html;
}

// ── Helpers ──
function formatDate(str) {
  const [y,m,d] = str.split('-');
  return new Date(y, m-1, d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  setTimeout(() => t.className = 'toast', 2800);
}
</script>
</body>
</html>
